name: Repository continuity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate records and links
        run: python scripts/validate_repository.py
      - name: Validate ten-year cap tracker
        run: python scripts/render_jaguars_cap_tracker.py --check
      - name: Regression tests
        # One process per test module on four cores; the verbose log of any
        # failed module is printed, and every module's log is kept below.
        run: python scripts/run_suite_parallel.py . --jobs 4 --out "${{ runner.temp }}/regression-test-logs"
      - name: Keep the regression test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-logs
          path: ${{ runner.temp }}/regression-test-logs
          if-no-files-found: ignore
      - name: Report the separate game gate
        shell: bash
        run: |
          set +e
          python scripts/check_game_readiness.py > readiness-report.txt
          result=$?
          cat readiness-report.txt
          cat readiness-report.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -eq 1 ]; then
            echo '::notice::Game execution remains BLOCKED; this workflow validates repository continuity.'
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
